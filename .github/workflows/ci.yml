name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Una compilacion en curso por rama: los empujones seguidos cancelan el anterior
# en lugar de hacer cola. Compilar FFmpeg no es barato.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: 1
  # Cache binaria de vcpkg sobre el almacen de Actions. Sin esto, cada
  # ejecucion recompila FFmpeg desde fuente y tarda entre ocho y quince
  # minutos; con esto, las siguientes se lo descargan ya compilado.
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  build:
    name: Compilar y auditar dependencias
    runs-on: windows-2025

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Preparar MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Instalar Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # run-vcpkg lee el commit de vcpkg.json ("builtin-baseline") y clona esa
      # revision exacta. Sin baseline aborta antes de empezar, que es lo que
      # hacia fallar este flujo de trabajo desde el primer dia.
      - name: Exponer el almacen de cache a vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Preparar vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configurar
        run: cmake --preset release

      - name: Compilar
        run: cmake --build --preset release

      # El binario autocontenido es la propiedad que define el proyecto. Si
      # aparece una DLL que no venga con Windows, la compilacion debe fallar:
      # es mucho mas facil detectarlo aqui que cuando a alguien no le arranca.
      - name: Comprobar que el binario es autocontenido
        shell: pwsh
        run: |
          $exe = 'build/release/bin/pyxis.exe'
          if (-not (Test-Path $exe)) { throw "No se genero $exe" }

          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "pyxis.exe: $size MB"

          $imports = (& dumpbin /DEPENDENTS $exe) -split "`n" |
                     Where-Object { $_ -match '\.dll\s*$' } |
                     ForEach-Object { $_.Trim().ToLower() }

          $allowed = @(
            'kernel32.dll','user32.dll','gdi32.dll','shell32.dll','ole32.dll',
            'oleaut32.dll','advapi32.dll','shcore.dll','comdlg32.dll','dwmapi.dll',
            'd3d11.dll','dxgi.dll','d2d1.dll','dwrite.dll','avrt.dll','winmm.dll',
            'mf.dll','mfplat.dll','mfreadwrite.dll','propsys.dll','bcrypt.dll',
            'secur32.dll','ncrypt.dll','crypt32.dll','ws2_32.dll','version.dll',
            'psapi.dll','userenv.dll','ntdll.dll','windowscodecs.dll'
          )

          $unexpected = $imports | Where-Object {
            $_ -notin $allowed -and $_ -notlike 'api-ms-win-*'
          }

          Write-Host "Dependencias: $($imports -join ', ')"

          if ($unexpected) {
            Write-Host "::error::Dependencias ajenas al sistema: $($unexpected -join ', ')"
            exit 1
          }
          Write-Host "Solo depende de componentes de Windows."

      # Los shaders se compilan en tiempo de construccion, asi que un error de
      # HLSL ya habria roto el paso anterior. Esto verifica que el bytecode
      # acabo dentro del binario y no en un archivo suelto olvidado.
      - name: Comprobar que no hay artefactos sueltos
        shell: pwsh
        run: |
          $stray = Get-ChildItem 'build/release/bin' -File |
                   Where-Object { $_.Extension -notin '.exe', '.pdb' }
          if ($stray) {
            Write-Host "::error::Archivos inesperados junto al ejecutable: $($stray.Name -join ', ')"
            exit 1
          }
          Write-Host "El directorio de salida solo contiene el ejecutable."

      - name: Publicar el binario
        uses: actions/upload-artifact@v4
        with:
          name: pyxis-windows-x64
          path: build/release/bin/pyxis.exe
          if-no-files-found: error
